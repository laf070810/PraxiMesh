{% load i18n localized %}{% if page.has_other_pages %}<nav class="pagination" aria-label="{% translate '分页' %}">{% if page.has_previous %}<a href="?page={{ page.previous_page_number }}">{% translate "上一页" %}</a>{% endif %}<span>{{ page.number }} / {{ page.paginator.num_pages }}</span>{% if page.has_next %}<a href="?page={{ page.next_page_number }}">{% translate "下一页" %}</a>{% endif %}</nav>{% endif %}
