name: Real WASI learning and practice acceptance
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-wasi:
    # Disposable hosted runner, never a privileged shared execution node.
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install uv==0.11.8
      - run: uv sync --frozen --group judge --group browser
      - name: Build pinned trusted Python and JavaScript interpreters
        run: |
          .venv/bin/python scripts/build_wasi.py --output var/wasi-python --workdir "$RUNNER_TEMP/wasi-build" --jobs 4
          curl --fail --location --max-time 60 --output "$RUNNER_TEMP/quickjs.tar.xz" https://bellard.org/quickjs/quickjs-2026-06-04.tar.xz
          .venv/bin/python scripts/build_functions_wasi.py --python-bundle var/wasi-python --python-sha256 "$(sha256sum var/wasi-python/manifest.json | cut -d ' ' -f 1)" --sdk-archive "$RUNNER_TEMP/wasi-build/wasi-sdk-24.0-x86_64-linux.tar.gz" --quickjs-archive "$RUNNER_TEMP/quickjs.tar.xz" --workdir "$RUNNER_TEMP/functions-build" --output var/wasi-functions
          printf 'JUDGE_BACKEND=wasi\n' >> "$GITHUB_ENV"
          printf 'JUDGE_WASI_BUNDLE=%s/var/wasi-functions\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          printf 'JUDGE_WASI_SHA256=%s\n' "$(sha256sum var/wasi-functions/manifest.json | cut -d ' ' -f 1)" >> "$GITHUB_ENV"
      - name: Record the real startup receipt for queued worker tests
        run: .venv/bin/python manage.py sandbox_check
      - name: Real isolation, reference, incorrect solution and lifecycle checks
        env:
          RUN_SANDBOX_TESTS: '1'
        run: .venv/bin/python scripts/postgres_tests.py -q --junitxml=test-results/wasi.xml
      - run: .venv/bin/playwright install --with-deps chromium
      - name: Fetch the pinned TLS proxy
        run: .venv/bin/python scripts/fetch_caddy.py --output var/tools/caddy-2.11.7
      - name: Real HTTPS deployment, browser journey, PostgreSQL roles and capacity
        run: .venv/bin/python scripts/production_acceptance.py --caddy var/tools/caddy-2.11.7
      - name: Build an immutable Web and WASI worker release
        run: |
          .venv/bin/python scripts/release.py build --bundle var/wasi-functions --bundle-sha256 "$JUDGE_WASI_SHA256" --output var/releases/candidate
          printf 'RELEASE_SHA256=%s\n' "$(sha256sum var/releases/candidate/release.json | cut -d ' ' -f 1)" >> "$GITHUB_ENV"
      - name: Import and exercise the packaged release
        run: .venv/bin/python scripts/release_acceptance.py --release var/releases/candidate --sha256 "$RELEASE_SHA256"
      - name: Build an intentionally failing migration fixture
        run: |
          .venv/bin/python scripts/build_failed_migration_release.py --release var/releases/candidate --sha256 "$RELEASE_SHA256" --bundle var/wasi-functions --bundle-sha256 "$JUDGE_WASI_SHA256" --output var/releases/migration-failure
          printf 'FAILED_RELEASE_SHA256=%s\n' "$(sha256sum var/releases/migration-failure/release.json | cut -d ' ' -f 1)" >> "$GITHUB_ENV"
      - name: Real deployment, failed migration and interrupted recovery
        run: |
          .venv/bin/python scripts/deploy_acceptance.py --release var/releases/candidate --manifest-sha256 "$RELEASE_SHA256" --failed-release var/releases/migration-failure --failed-manifest-sha256 "$FAILED_RELEASE_SHA256" --caddy var/tools/caddy-2.11.7
      - name: Audit judge dependencies
        run: .venv/bin/pip-audit --progress-spinner off
      - name: Retain the verified deployable release
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: immutable-release
          path: var/releases/candidate/
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: real-wasi-acceptance
          path: |
            test-results/
            var/wasi-functions/manifest.json
            var/releases/candidate/release.json
